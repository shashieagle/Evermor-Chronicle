kind = "web"
previewPath = "/"
title = "Evermor"
version = "1.0.0"
id = "artifacts/evermor"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19470

[services.development]
run = "pnpm --filter @workspace/evermor run dev"

[services.production]
serve = "static"
publicDir = "artifacts/evermor/dist/public"

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/evermor", "run", "build" ]

[services.production.build.env]
PORT = "19470"
BASE_PATH = "/"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19470"
BASE_PATH = "/"
